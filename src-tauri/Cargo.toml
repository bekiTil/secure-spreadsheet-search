[package]
name = "secure-spreadsheet-search"
version = "1.0.0"
description = "Secure offline desktop application for searching spreadsheet data"
authors = ["Secure Spreadsheet Search"]
license = "MIT"
repository = ""
default-run = "secure-spreadsheet-search"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "secure_spreadsheet_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "secure-spreadsheet-search"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.7", features = [
  "dialog-open",
  "dialog-save",
  "fs-read-file",
  "fs-write-file",
  "fs-create-dir",
  "fs-read-dir",
  "fs-remove-file",
  "fs-rename-file",
  "path-all",
  "protocol-asset",
  "shell-open",
  "window-close",
  "window-minimize",
  "window-maximize",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# We use AES-256-GCM encryption manually rather than sqlcipher for wider platform compatibility
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
calamine = { version = "0.24", features = ["dates"] }
csv = "1.3"
zip = "2.1"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
